[project]
name = "marklogic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "faiss-cpu==1.12.0",
    "flask==3.1.3",
    "flask-mail==0.10.0",
    "imagehash==4.3.2",
    "jellyfish>=1.2.1",
    "numpy",
    # ultralytics (YOLO) hard-requires opencv-python; paddleocr hard-requires
    # opencv-contrib-python. Both packages install into the same `cv2`
    # namespace and whichever installs last silently wins - pinning both to
    # the identical upstream OpenCV release keeps that "winner" functionally
    # equivalent instead of a version drifting on future `uv sync`.
    "opencv-contrib-python==4.10.0.84",
    "opencv-python==4.10.0.84",
    "paddleocr==3.7.0",
    "paddlepaddle",
    "pandas==3.0.1",
    "pdfplumber==0.11.1",
    "pillow==12.1.1",
    "psycopg2-binary==2.9.10",
    "pymupdf",
    "python-dotenv==1.2.2",
    "reportlab==4.2.0",
    "scipy==1.17.1",
    "sentence-transformers==5.1.1",
    "tqdm==4.65.0",
    "ultralytics==8.4.21",
    "werkzeug==3.1.7",
]

[tool.uv]
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
